name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm release
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Check operational portability
        run: npm run portability:check

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Build the production frontend
        run: npm run build

      - name: Audit deployment assets
        run: npm run deploy:check

      - name: Validate Linux deployment scripts
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/*.sh
          for script in deploy/*.sh; do test -x "$script"; done
          sudo install -m 0755 deploy/auto-update.sh /usr/local/sbin/sysvexa-update
          systemd-analyze verify deploy/sysvexa-update.service deploy/sysvexa-update.timer

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high
