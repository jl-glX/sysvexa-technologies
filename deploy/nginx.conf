# Alternativa equivalente a deploy/Caddyfile. Ambos sirven el mismo artefacto
# y el mismo enlace current; cambiar el proxy no requiere recompilar la web.
server {
    listen 80;
    listen [::]:80;
    server_name sysvexatechnologies.com www.sysvexatechnologies.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sysvexatechnologies.com www.sysvexatechnologies.com;

    # Instalar certificados publicos validos antes de activar esta alternativa.
    ssl_certificate /etc/letsencrypt/live/sysvexatechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysvexatechnologies.com/privkey.pem;
    root /var/www/sysvexa/current;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(?:\.env|\.git|\.ssh|package(?:-lock)?\.json|Caddyfile|nginx\.conf) {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
