# Alternativa equivalente a deploy/Caddyfile. Ambos sirven el mismo artefacto
# y el mismo enlace current; cambiar el proxy no requiere recompilar la web.
server {
    listen 80;
    listen [::]:80;
    server_name sysvexatechnologies.com www.sysvexatechnologies.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sysvexatechnologies.com www.sysvexatechnologies.com;

    # Instalar certificados publicos validos antes de activar esta alternativa.
    ssl_certificate /etc/letsencrypt/live/sysvexatechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysvexatechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /var/www/sysvexa/current;
    index index.html;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://challenges.cloudflare.com; img-src 'self' data:; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    if ($request_method ~ ^(CONNECT|TRACE|TRACK)$) {
        return 405;
    }

    # Perfil de sondas heredado de Umbravia Forge. El 404 uniforme evita que
    # el fallback SPA confirme rutas inexistentes mediante una respuesta 200.
    location ~* (?:^/(?:\.env|\.git|\.hg|\.svn|\.ssh|\.aws)(?:[./]|$)|^/(?:\.npmrc|\.yarnrc|\.htaccess|\.htpasswd|\.DS_Store|config\.json|pnpm-lock\.yaml|yarn\.lock|Dockerfile|Caddyfile|nginx\.conf|web\.config|appsettings\.json|id_rsa|id_ed25519)$|^/(?:docker-compose|composer|package)[^/]*|^/(?:wp-admin|wp-content|wp-includes|phpmyadmin|adminer|vendor/phpunit|cgi-bin|actuator)(?:/|$)|^/(?:wp-login\.php|xmlrpc\.php|server-status)(?:/|$)|\.(?:php|phtml|phar|asp|aspx|jsp|cgi|pem|key|p12|pfx|sql|sqlite|sqlite3|db|bak|backup|old|orig|save|swp)(?:$|/)|~$) {
        return 404;
    }
    location ~ ^/api/service-requests(?:/|$) {
        proxy_pass https://forms.sysvexatechnologies.com;
        proxy_ssl_server_name on;
        proxy_ssl_name forms.sysvexatechnologies.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;
        proxy_set_header Host forms.sysvexatechnologies.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
